<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAYDEN · کاتالوگ برندها</title>
<meta name="description" content="حراج بلک فرایدی جایدن — کیف، کفش و لباس برندهای جهانی با قیمت نهایی به تومان">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JAYDEN">
<meta property="og:title" content="JAYDEN · حراج بلک فرایدی">
<meta property="og:description" content="کیف، کفش و لباس برندهای جهانی با قیمت نهایی به تومان — Coach، Michael Kors، JW PEI، Karl Lagerfeld و …">
<meta property="og:url" content="https://jaydenim-co.github.io/jayden/">
<meta property="og:image" content="https://jaydenim-co.github.io/jayden/og2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jaydenim-co.github.io/jayden/og2.jpg">
<meta name="theme-color" content="#0c0b09">
<link rel="stylesheet" href="assets/style.css?v=20261124e">
</head>
<body>
<div class="pricenote" role="alert">⚠️ به دلیل افزایش قیمت دلار، قیمت‌های سایت به‌روز نیستند. لطفاً قیمت نهایی را از طریق دایرکت یا واتساپ استعلام بگیرید.</div>
<div class="home">
  <header>
    <a class="logo" href="index.html" aria-label="صفحه اصلی">JAYDEN</a>
    <small>YOU DESERVE IT</small>
  </header>
  <section class="hero">
    <h1>حراج <span class="en">BLACK FRIDAY</span></h1>
    <p>قیمت‌ها به تومان و نهایی است. یک دسته را انتخاب کنید، بعد روی برند بزنید تا همه محصولات را ببینید.</p>
  </section>
  <nav class="secs" id="secs" aria-label="دسته‌ها"></nav>
  <div class="promo" id="promo"></div>
  <div class="secban" id="sechead" hidden>
    <a href="#" class="secback">‹ همه دسته‌ها</a>
    <div class="sb-in"><div class="sb-ic" id="secic" aria-hidden="true"></div><div class="sb-tx"><small id="secen"></small><h2 id="sectitle"></h2><p id="secsub"></p></div></div>
  </div>
  <nav class="brands" id="brands" aria-label="برندها" hidden></nav>
  <footer class="contact">
    <span>سفارش و مشاوره</span>
    <div class="order" id="order"></div>
  </footer>
</div>
<script src="assets/config.js?v=20261124e"></script>
<script src="assets/bfhang.js?v=20261124e" defer></script>
<script>
(function () {
  var C = window.JAYDEN, fa = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '٬').replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); };
  var nav = document.getElementById('brands'), secs = document.getElementById('secs'), counts = {};
  function count(b, cb) {
    if (counts[b.slug]) return cb(counts[b.slug]);
    fetch('data/' + b.slug + '.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
      var by = { all: 0 };
      d.cats.forEach(function (c) { by.all += c.items.length; if (c.g) by[c.g] = (by[c.g] || 0) + c.items.length; });
      counts[b.slug] = by; cb(by);
    }).catch(function () {});
  }
  var ICO = {
    men: '<circle cx="12" cy="6.3" r="3.4"/><path d="M4.5 21v-2.3c0-3.1 2.5-5.6 5.6-5.6h3.8c3.1 0 5.6 2.5 5.6 5.6V21"/><path d="M12 13.1l-1.3 2.2L12 20.5l1.3-5.2z"/>',
    women: '<circle cx="12" cy="7" r="3.2"/><path d="M8.8 6.4c-.4 3.2.2 5.4-1.6 6.8M15.2 6.4c.4 3.2-.2 5.4 1.6 6.8"/><path d="M4.5 21v-1.8c0-2.9 2.3-5.2 5.2-5.2h4.6c2.9 0 5.2 2.3 5.2 5.2V21"/><path d="M10 14l2 2.8 2-2.8"/>',
    kids: '<circle cx="9.5" cy="9.2" r="2.6"/><path d="M5.3 21v-2.6c0-2.3 1.9-4.2 4.2-4.2s4.2 1.9 4.2 4.2V21"/><ellipse cx="18" cy="5.2" rx="2.4" ry="3"/><path d="M18 8.2l-.5 1.6.6 1.2-1 3"/>',
    beauty: '<rect x="8.5" y="12" width="7" height="9" rx="1"/><path d="M9.5 12V8.6h5V12"/><path d="M10.6 8.6V4.6l2.8-1.6v5.6"/>'
  };
  function feat(a, b, g, home) {
    a.className = 'feat' + (home ? ' feat-home' : '');
    a.innerHTML = '<div class="ft-top"><i class="prem"></i><em class="ft-cnt"></em></div><div class="ft-imgs">' +
      b.feat.map(function (u) { return '<span><img loading="lazy" alt="" src="' + u + '"></span>'; }).join('') +
      '</div><div class="ft-tx"><small class="ft-k">' + (home ? 'کالکشن ویژه' : 'کالکشن ویژه این بخش') + '</small><h3></h3><b class="ft-en"></b><p></p></div><span class="ft-cta">مشاهده کالکشن ‹</span>';
    a.querySelector('.prem').textContent = b.badge || 'PREMIUM';
    a.querySelector('h3').textContent = b.fa || b.name;
    a.querySelector('.ft-en').textContent = b.name;
    a.querySelector('p').textContent = b.line || b.sub;
    count(b, function (by) { a.querySelector('.ft-cnt').textContent = fa(g ? (by[g] || 0) : by.all) + ' مدل'; });
  }
  var TAG = { men: 'برندهای مخصوص آقایان', women: 'برندهای مخصوص خانم‌ها', kids: 'برندهای مخصوص بچه‌ها', beauty: 'آرایشی، مراقبت پوست و عطر' };
  function svg(id) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' + (ICO[id] || '') + '</svg>'; }
  C.sections.forEach(function (s) {
    var list = C.brands.filter(function (b) { return (b.secs || []).indexOf(s.id) >= 0 && !b.soon; });
    var a = document.createElement('a');
    a.className = 'sec' + (list.length ? '' : ' soon'); a.href = list.length ? '#' + s.id : '#';
    a.innerHTML = '<span class="sic" aria-hidden="true">' + svg(s.id) + '</span><b></b><i></i><em></em>';
    a.querySelector('b').textContent = s.fa; a.querySelector('i').textContent = s.en;
    a.querySelector('em').textContent = list.length ? (fa(list.length) + ' برند') : 'به‌زودی';
    if (!list.length) a.onclick = function (e) { e.preventDefault(); };
    secs.appendChild(a);
  });
  var pr = document.getElementById('promo');
  C.brands.filter(function (b) { return b.feat && !b.soon; }).forEach(function (b) {
    var s0 = b.secs[0], g = b.group && b.group[s0], a = document.createElement('a');
    a.href = 'brand.html?b=' + b.slug + '&s=' + s0 + (g ? '&g=' + g : '');
    feat(a, b, g, true); pr.appendChild(a);
  });
  function show() {
    var id = location.hash.slice(1), s = C.sections.filter(function (x) { return x.id === id; })[0];
    secs.hidden = !!s; pr.hidden = !!s; nav.hidden = !s; document.getElementById('sechead').hidden = !s;
    document.querySelector('.hero').hidden = !!s;
    if (!s) return;
    var nb = C.brands.filter(function (b) { return (b.secs || []).indexOf(s.id) >= 0 && !b.soon; }).length;
    document.getElementById('sectitle').textContent = 'بخش ' + s.fa;
    document.getElementById('secen').textContent = s.en;
    document.getElementById('secic').innerHTML = svg(s.id);
    document.getElementById('secsub').textContent = (TAG[s.id] || '') + ' (' + fa(nb) + ' برند)';
    document.getElementById('sechead').className = 'secban sb-' + s.id;
    nav.innerHTML = '';
    C.brands.filter(function (b) { return (b.secs || []).indexOf(s.id) >= 0; }).forEach(function (b) {
      var a = document.createElement('a'), g = b.group && b.group[s.id];
      a.className = 'brand' + (b.soon ? ' soon' : '');
      a.href = b.soon ? '#' + s.id : 'brand.html?b=' + b.slug + '&s=' + s.id + (g ? '&g=' + g : '');
      if (b.feat) { feat(a, b, g); nav.appendChild(a); return; }
      a.innerHTML = '<div><b></b><span></span></div><em></em>';
      a.querySelector('b').textContent = b.name; if (b.font) a.querySelector('b').classList.add(b.font);
      if (b.badge) { a.classList.add('lux'); a.querySelector('div').insertAdjacentHTML('afterbegin', '<i class="prem">' + b.badge + '</i>'); }
      a.querySelector('span').textContent = (b.subs && b.subs[s.id]) || b.sub;
      a.querySelector('em').textContent = b.soon ? 'به‌زودی' : 'مشاهده';
      nav.appendChild(a);
      if (!b.soon) count(b, function (by) { a.querySelector('em').textContent = fa(g ? (by[g] || 0) : by.all) + ' محصول'; });
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show); show();
  function orderBox() { document.getElementById('order').innerHTML =
    '<a class="ig" href="' + (location.hash === '#men' && C.instagramMen ? C.instagramMen : C.instagram) + '" target="_blank" rel="noopener">دایرکت اینستاگرام</a>' +
    '<a class="wa" href="' + C.whatsapp + '" target="_blank" rel="noopener">واتساپ</a>'; }
  orderBox(); window.addEventListener('hashchange', orderBox);
})();
</script>
<script>window.goatcounter={path:function(p){return location.pathname+location.search}};</script>
<script data-goatcounter="https://jaydenim-co.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
